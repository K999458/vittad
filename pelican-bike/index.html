<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车 · 2D SVG 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2a32;
      --muted: #4d5d67;
      --paper: #f3f7f4;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 500px at 80% -10%, #d7f0c8 0%, transparent 55%),
        linear-gradient(180deg, #e7f4fb 0%, var(--paper) 100%);
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      color: var(--ink);
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 2vw + 1rem, 2.2rem);
      letter-spacing: 0.02em;
    }
    p.lead {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 1.02rem;
    }
    .stage {
      background: #fff;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 18px 40px rgba(29, 42, 50, 0.12);
      overflow: hidden;
    }
    .stage svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }
    footer {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    code {
      background: #e7eef1;
      padding: 0.1em 0.4em;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main>
    <h1>鹈鹕骑自行车</h1>
    <p class="lead">纯 SVG 绘制的 2D 循环动画：车轮旋转、喉囊轻微鼓动、翅膀扇动，沿公路从左向右骑行。</p>
    <div class="stage">
      <!-- 内嵌与 pelican-bike.svg 相同的动画画面，打开本页即可播放 -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
        <title id="title">鹈鹕骑自行车</title>
        <desc id="desc">一只卡通鹈鹕骑着自行车从左向右循环前进的 2D 动画。</desc>
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8ecae6"/>
            <stop offset="55%" stop-color="#cde7f5"/>
            <stop offset="100%" stop-color="#eef7fb"/>
          </linearGradient>
          <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffe08a"/>
            <stop offset="100%" stop-color="#ffb703"/>
          </linearGradient>
          <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9dcf8a"/>
            <stop offset="100%" stop-color="#6fb36a"/>
          </linearGradient>
          <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6fbf73"/>
            <stop offset="100%" stop-color="#3d8b54"/>
          </linearGradient>
          <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6b6f76"/>
            <stop offset="100%" stop-color="#3f4349"/>
          </linearGradient>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fffdf8"/>
            <stop offset="100%" stop-color="#e9e1d4"/>
          </linearGradient>
          <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffd166"/>
            <stop offset="55%" stop-color="#f4a261"/>
            <stop offset="100%" stop-color="#e76f51"/>
          </linearGradient>
          <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2ec4b6"/>
            <stop offset="100%" stop-color="#1b7f78"/>
          </linearGradient>
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#1d2a32" flood-opacity="0.22"/>
          </filter>
          <filter id="tinyShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1d2a32" flood-opacity="0.25"/>
          </filter>
        </defs>
        <style>
          .cloud-a { animation: drift 28s linear infinite; }
          .cloud-b { animation: drift 36s linear infinite; animation-delay: -12s; }
          .cloud-c { animation: drift 22s linear infinite; animation-delay: -6s; }
          .dashes { animation: dash 0.7s linear infinite; }
          .rider { animation: ride 9s linear infinite; }
          .bob { animation: bob 0.55s ease-in-out infinite; }
          .wing { animation: flap 0.9s ease-in-out infinite; transform-origin: 18px 18px; transform-box: fill-box; }
          .wheel { animation: spin 0.55s linear infinite; transform-origin: 36px 36px; transform-box: fill-box; }
          .crank { animation: spin 0.55s linear infinite; transform-origin: 14px 14px; transform-box: fill-box; }
          .pouch { animation: pouch 1.1s ease-in-out infinite; transform-origin: 40px 8px; transform-box: fill-box; }
          @keyframes drift {
            from { transform: translateX(-220px); }
            to { transform: translateX(1180px); }
          }
          @keyframes dash {
            from { transform: translateX(0); }
            to { transform: translateX(-72px); }
          }
          @keyframes ride {
            from { transform: translate(-220px, 0); }
            to { transform: translate(1100px, 0); }
          }
          @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
          }
          @keyframes flap {
            0%, 100% { transform: rotate(8deg); }
            50% { transform: rotate(-10deg); }
          }
          @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
          }
          @keyframes pouch {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.08); }
          }
        </style>
        <rect width="960" height="540" fill="url(#sky)"/>
        <circle cx="820" cy="90" r="54" fill="url(#sunGlow)"/>
        <circle cx="820" cy="90" r="78" fill="#ffe08a" opacity="0.18"/>
        <g class="cloud-a" fill="#ffffff" opacity="0.92">
          <g transform="translate(40,70)">
            <ellipse cx="40" cy="28" rx="38" ry="18"/>
            <ellipse cx="70" cy="24" rx="30" ry="16"/>
            <ellipse cx="18" cy="30" rx="22" ry="13"/>
          </g>
        </g>
        <g class="cloud-b" fill="#ffffff" opacity="0.85">
          <g transform="translate(0,130)">
            <ellipse cx="40" cy="22" rx="34" ry="15"/>
            <ellipse cx="68" cy="20" rx="24" ry="13"/>
            <ellipse cx="16" cy="24" rx="18" ry="11"/>
          </g>
        </g>
        <g class="cloud-c" fill="#ffffff" opacity="0.8">
          <g transform="translate(120,48)">
            <ellipse cx="36" cy="18" rx="28" ry="12"/>
            <ellipse cx="58" cy="16" rx="18" ry="10"/>
          </g>
        </g>
        <path fill="url(#hillFar)" d="M0 330 C120 270 190 300 280 280 C370 258 430 300 520 275 C630 246 720 290 820 268 C890 252 940 280 960 270 L960 380 L0 380 Z"/>
        <path fill="url(#hillNear)" d="M0 360 C90 320 170 345 260 328 C360 308 430 350 540 332 C650 312 740 348 860 330 C910 322 940 336 960 332 L960 410 L0 410 Z"/>
        <rect y="400" width="960" height="140" fill="#4c9a5d"/>
        <rect y="418" width="960" height="88" fill="url(#road)"/>
        <rect y="418" width="960" height="8" fill="#d9dde3"/>
        <rect y="498" width="960" height="8" fill="#d9dde3"/>
        <g class="dashes">
          <g fill="#f4e27a">
            <rect x="-72" y="456" width="42" height="8" rx="3"/>
            <rect x="0" y="456" width="42" height="8" rx="3"/>
            <rect x="72" y="456" width="42" height="8" rx="3"/>
            <rect x="144" y="456" width="42" height="8" rx="3"/>
            <rect x="216" y="456" width="42" height="8" rx="3"/>
            <rect x="288" y="456" width="42" height="8" rx="3"/>
            <rect x="360" y="456" width="42" height="8" rx="3"/>
            <rect x="432" y="456" width="42" height="8" rx="3"/>
            <rect x="504" y="456" width="42" height="8" rx="3"/>
            <rect x="576" y="456" width="42" height="8" rx="3"/>
            <rect x="648" y="456" width="42" height="8" rx="3"/>
            <rect x="720" y="456" width="42" height="8" rx="3"/>
            <rect x="792" y="456" width="42" height="8" rx="3"/>
            <rect x="864" y="456" width="42" height="8" rx="3"/>
            <rect x="936" y="456" width="42" height="8" rx="3"/>
            <rect x="1008" y="456" width="42" height="8" rx="3"/>
          </g>
        </g>
        <g class="rider">
          <g transform="translate(80, 456)">
            <ellipse cx="78" cy="8" rx="86" ry="10" fill="#1d2a32" opacity="0.22"/>
            <g class="wheel" transform="translate(6,-72)">
              <circle cx="36" cy="36" r="34" fill="#1f2933" stroke="#0f141a" stroke-width="3"/>
              <circle cx="36" cy="36" r="27" fill="none" stroke="#9aa3ad" stroke-width="2"/>
              <g stroke="#c5ccd3" stroke-width="1.6">
                <line x1="36" y1="36" x2="36" y2="6"/>
                <line x1="36" y1="36" x2="62" y2="21"/>
                <line x1="36" y1="36" x2="62" y2="51"/>
                <line x1="36" y1="36" x2="36" y2="66"/>
                <line x1="36" y1="36" x2="10" y2="51"/>
                <line x1="36" y1="36" x2="10" y2="21"/>
              </g>
              <circle cx="36" cy="36" r="7" fill="#f4a261"/>
              <circle cx="36" cy="36" r="3" fill="#fff3d6"/>
            </g>
            <g class="wheel" transform="translate(118,-72)">
              <circle cx="36" cy="36" r="34" fill="#1f2933" stroke="#0f141a" stroke-width="3"/>
              <circle cx="36" cy="36" r="27" fill="none" stroke="#9aa3ad" stroke-width="2"/>
              <g stroke="#c5ccd3" stroke-width="1.6">
                <line x1="36" y1="36" x2="36" y2="6"/>
                <line x1="36" y1="36" x2="62" y2="21"/>
                <line x1="36" y1="36" x2="62" y2="51"/>
                <line x1="36" y1="36" x2="36" y2="66"/>
                <line x1="36" y1="36" x2="10" y2="51"/>
                <line x1="36" y1="36" x2="10" y2="21"/>
              </g>
              <circle cx="36" cy="36" r="7" fill="#f4a261"/>
              <circle cx="36" cy="36" r="3" fill="#fff3d6"/>
            </g>
            <g fill="none" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#tinyShadow)">
              <path d="M42 -36 L78 -36 L118 -92"/>
              <path d="M42 -36 L70 -100 L118 -92"/>
              <path d="M70 -100 L42 -36"/>
              <path d="M154 -36 L128 -108"/>
            </g>
            <circle cx="78" cy="-36" r="8" fill="#14746f"/>
            <path d="M52 -112 C58 -122 86 -122 96 -112 C88 -106 60 -106 52 -112Z" fill="#243137"/>
            <path d="M128 -108 C136 -122 148 -124 160 -118" fill="none" stroke="#243137" stroke-width="6" stroke-linecap="round"/>
            <rect x="154" y="-122" width="16" height="7" rx="3.5" fill="#e76f51"/>
            <g class="crank" transform="translate(64,-50)">
              <line x1="14" y1="14" x2="14" y2="-10" stroke="#243137" stroke-width="5" stroke-linecap="round"/>
              <line x1="14" y1="14" x2="14" y2="38" stroke="#243137" stroke-width="5" stroke-linecap="round"/>
              <rect x="4" y="-18" width="20" height="8" rx="3" fill="#f4a261"/>
              <rect x="4" y="38" width="20" height="8" rx="3" fill="#e76f51"/>
              <ellipse cx="14" cy="-18" rx="12" ry="7" fill="#f4a261"/>
              <ellipse cx="14" cy="46" rx="12" ry="7" fill="#e76f51"/>
            </g>
            <g class="bob">
              <path d="M62 -92 C58 -70 70 -58 78 -42" fill="none" stroke="#f4a261" stroke-width="7" stroke-linecap="round"/>
              <path d="M78 -90 C84 -68 74 -56 78 -42" fill="none" stroke="#e76f51" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
              <path d="M18 -108 C4 -118 -6 -108 8 -96 C14 -100 18 -102 22 -100Z" fill="#d9cfc0"/>
              <ellipse cx="52" cy="-118" rx="48" ry="30" fill="url(#bodyGrad)" filter="url(#softShadow)"/>
              <g class="wing">
                <ellipse cx="40" cy="-112" rx="34" ry="16" fill="#d9cfc0"/>
                <path d="M18 -112 C8 -118 2 -108 16 -102" fill="#2b2d42"/>
                <path d="M22 -106 C12 -110 8 -102 20 -98" fill="#2b2d42"/>
              </g>
              <path d="M78 -128 C96 -138 102 -158 118 -164" fill="none" stroke="#f7f1e6" stroke-width="16" stroke-linecap="round"/>
              <path d="M78 -128 C96 -138 102 -158 118 -164" fill="none" stroke="#efe6d6" stroke-width="10" stroke-linecap="round"/>
              <circle cx="126" cy="-168" r="18" fill="#fffdf8" filter="url(#tinyShadow)"/>
              <circle cx="132" cy="-172" r="4.2" fill="#1d2a32"/>
              <circle cx="133.3" cy="-173.4" r="1.4" fill="#ffffff"/>
              <path d="M124 -176 C128 -180 136 -180 140 -176" fill="none" stroke="#1d2a32" stroke-width="1.4" stroke-linecap="round"/>
              <g transform="translate(138,-170)">
                <path d="M0 -6 C18 -14 48 -10 78 -2 C50 4 18 6 2 4Z" fill="url(#beakGrad)"/>
                <path d="M8 2 C22 28 58 26 74 4 C48 10 22 8 8 2Z" fill="#e76f51" class="pouch"/>
                <path d="M0 -2 C30 -6 60 -4 78 -2" fill="none" stroke="#c45c3e" stroke-width="1.4" opacity="0.5"/>
              </g>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <footer>对应独立文件：<code>pelican-bike/pelican-bike.svg</code>，可直接用浏览器打开。</footer>
  </main>
</body>
</html>
